name: Build Tally Bridge for Windows

# Builds the standalone Windows bridge and Control Centre package used by the
# Tally computer. Runs on every bridge/UI change and can be started manually.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      # Pushing a tag like tally-control-centre-2026.11.13 publishes a stable
      # release. Path filters do not apply to tag pushes.
      - "tally-control-centre-*"
    paths:
      - ".github/workflows/build-tally-bridge-windows.yml"
      - "express_tally/bridge/**"
      - "control-centre/**"
      - "tally_plugin/**"

permissions:
  contents: write

concurrency:
  group: tally-bridge-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tally_plugin/requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-centre/package-lock.json

      - name: Build Control Centre UI
        run: npm --prefix control-centre ci && npm --prefix control-centre run build

      - name: Run bridge tests
        run: python -m unittest express_tally.tests.test_bridge express_tally.tests.test_payments express_tally.tests.test_ledger_bridge express_tally.tests.test_tally_safety express_tally.tests.test_unit_names

      - name: Build standalone executable and package
        shell: powershell
        run: .\tally_plugin\build-windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ERPNext-Tally-Control-Centre-Windows-x64
          path: |
            dist/ERPNext-Tally-Control-Centre-Windows-x64.zip
            dist/ERPNext-Tally-Control-Centre-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Tally Control Centre ${{ github.ref_name }}
          body: |
            Standalone Windows x64 Tally Control Centre built from commit ${{ github.sha }}.
            Python is not required on the Tally computer.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/ERPNext-Tally-Control-Centre-Windows-x64.zip
            dist/ERPNext-Tally-Control-Centre-Windows-x64.zip.sha256

      - name: Update rolling GitHub prerelease
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tally-bridge-latest
          target_commitish: ${{ github.sha }}
          name: Tally Bridge Latest
          body: Standalone Windows x64 Tally bridge built from commit ${{ github.sha }}. Python is not required on the Tally computer.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/ERPNext-Tally-Control-Centre-Windows-x64.zip
            dist/ERPNext-Tally-Control-Centre-Windows-x64.zip.sha256
